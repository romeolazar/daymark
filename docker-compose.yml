services:
  app:
    image: romeolazar/daymark:latest
    container_name: daymark
    ports:
      - "${APP_PORT:-1403}:1403"
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your environment}
      # Optional: enables the manual /api/cron trigger. Reminders run automatically without it.
      CRON_TOKEN: ${CRON_TOKEN:-}
      TZ: ${TZ:-UTC}
    volumes:
      - daymark_data:/app/data
      - uploads_data:/app/public/uploads
    restart: unless-stopped

volumes:
  daymark_data:
    name: daymark_data
  uploads_data:
